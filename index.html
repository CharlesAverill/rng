<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RNG Suite</title>
  <link rel="stylesheet" type="text/css" href="/rng/static/style.css" />
  <link rel="icon" href="/rng/static/favicon.ico" type="image/x-icon"> 
</head>

<body>
  <header id="toolbar">
    <h1><a href="/rng/" style="text-decoration: none; color: white">RNG Suite</a></h1>
    <div class="menu" id="file-menu">
      <button class="menu-button">File ▾</button>
      <div class="dropdown">
        <!-- <label for="entropy" class="menu-item">
          Upload Entropy
          <input type="file" id="entropy" style="display: none" />
        </label> -->
        <button id="download-log" class="menu-item">Download Console Log</button>
      </div>
    </div>

    <div class="menu" id="edit-menu">
      <button class="menu-button">Edit ▾</button>
      <div class="dropdown">
        <button id="toggle-params" class="menu-item">Toggle Show Params</button>
      </div>
    </div>
  </header>

  <nav>
    <button class="active" data-target="basic">Numbers</button>
    <button data-target="collections">Collections</button>
    <button data-target="distributions">Distributions</button>
  </nav>

  <main>
    <section id="basic" class="active">
      <div>
        <h3>Random Integer [min, max)</h2>
        <input type="checkbox" id="signed-checkbox">
        <label for="signed-checkbox">Signed</label>
        <br>
        <label for="randint-min-number">Min</label>
        <input type="number" id="randint-min-number" value="0">
        <br>
        <label for="randint-max-number">Max</label>
        <input type="number" id="randint-max-number" value="100">
        <br>
        <button id="randint">Generate</button>
      </div>
      
      <div>
        <h3>Random Float [min, max)</h2>
        <label for="randfloat-min-number">Min</label>
        <input type="number" id="randfloat-min-number" value="0">
        <br>
        <label for="randfloat-max-number">Max</label>
        <input type="number" id="randfloat-max-number" value="100">
        <br>
        <button id="randfloat">Generate</button>
      </div>
    </section>

    <section id="collections">
      <div>
        <h3>Select from List</h3>
        <input type="checkbox" id="weighted-weighted-checkbox">
        <label for="weighted-weighted-checkbox">Weighted</label>
        <br>
        <button id="weighted-addrow">Add Row</button> <button id="weighted-deleterow">Delete Row</button> <button id="weighted-clear">Clear</button>
        <br>
        <table id="weighted-table">
          <thead>
            <th>Item</th>
            <th id="weighted-table-weight-header">Weight</th>
          </thead>
          <tbody>
            <!-- 
              <tr>
                <td>Item 1</td>
                <td class="weighted-table-weight-cell">0.1</td>
              </tr>
            -->
          </tbody>
        </table>
        <button id="weighted-select">Select</button>
      </div>
    </section>

    <section id="distributions">
      <h2>Distributions</h2>
      <button id="gaussian">Gaussian</button>
      <button id="exponential">Exponential</button>
    </section>

    <section id="custom">
      <h2>Custom Sources</h2>
      <p>Use uploaded entropy files or enter a seed manually.</p>
    </section>
  </main>

  <footer id="console-container">
    <div id="console">
      <div id="console-header">
        <button id="clear-console">Clear</button>
      </div>
    </div>
  </footer>

  <!-- Compiled js_of_ocaml script -->
  <script src="/rng/static/main.bc.js"></script>
  <script>
    // Simple JS to switch tabs visually (OCaml can later handle content)
    document.querySelectorAll("nav button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("nav button").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll("main section").forEach((s) => s.classList.remove("active"));
        btn.classList.add("active");
        const section = document.getElementById(btn.dataset.target);
        if (section) section.classList.add("active");
      });
    });
  </script>
</body>

</html>
